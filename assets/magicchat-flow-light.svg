<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MagicChat enterprise agent bus</title>
  <desc id="desc">An animated enterprise workflow connecting requests, Moli Agent, context, tasks, and human control.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8dee4"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#087ea4"/></marker>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .flow { stroke-dasharray: 8 10; animation: stream 1.8s linear infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .guard { animation: guard 2.6s ease-in-out infinite; }
      @keyframes stream { to { stroke-dashoffset: -36; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes guard { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .flow, .cursor, .guard { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="14" fill="#f6f8fa"/>
  <rect width="1200" height="430" rx="14" fill="url(#grid)" opacity=".76"/>
  <rect x="1" y="1" width="1198" height="428" rx="13" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="48" rx="13" fill="#ffffff"/>
  <path d="M1 36h1198" stroke="#ffffff" stroke-width="24"/>
  <path d="M1 49h1198" stroke="#d0d7de"/>
  <circle cx="24" cy="25" r="6" fill="#cf222e"/><circle cx="44" cy="25" r="6" fill="#bf8700"/><circle cx="64" cy="25" r="6" fill="#1a7f37"/>
  <text x="92" y="31" class="mono" font-size="14" fill="#1f2328">magicchat.enterprise-agent-bus</text>
  <text x="1168" y="31" text-anchor="end" class="mono" font-size="12" fill="#9a6700">chaitin/MagicChat · CORE DEVELOPER</text>

  <text x="42" y="85" class="mono" font-size="13" fill="#59636e">$ magicchat route --assistant=moli --policy=human-in-control</text>

  <g class="mono">
    <rect x="42" y="118" width="160" height="124" rx="9" fill="#ffffff" stroke="#d0d7de"/>
    <text x="60" y="146" font-size="12" fill="#59636e">INBOUND</text>
    <text x="60" y="180" font-size="18" font-weight="700" fill="#1f2328">REQUEST</text>
    <text x="60" y="208" font-size="12" fill="#59636e">message · mail</text>

    <rect x="260" y="108" width="186" height="144" rx="9" fill="#ffffff" stroke="#087ea4" stroke-width="2"/>
    <text x="278" y="138" font-size="12" fill="#9a6700">PERSONAL AI</text>
    <text x="278" y="176" font-size="20" font-weight="700" fill="#087ea4">MOLI AGENT</text>
    <text x="278" y="205" font-size="12" fill="#59636e">understand · triage</text>
    <text x="278" y="229" font-size="12" fill="#59636e">summarize · draft</text>

    <rect x="504" y="118" width="170" height="124" rx="9" fill="#ffffff" stroke="#d0d7de"/>
    <text x="522" y="146" font-size="12" fill="#59636e">WORKSPACE</text>
    <text x="522" y="180" font-size="18" font-weight="700" fill="#1f2328">CONTEXT</text>
    <text x="522" y="208" font-size="12" fill="#59636e">people · history</text>

    <rect x="732" y="118" width="180" height="124" rx="9" fill="#ffffff" stroke="#d0d7de"/>
    <text x="750" y="146" font-size="12" fill="#59636e">EXECUTION</text>
    <text x="750" y="180" font-size="18" font-weight="700" fill="#1f2328">TASK</text>
    <text x="750" y="208" font-size="12" fill="#59636e">assign · follow up</text>

    <rect x="970" y="108" width="188" height="144" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
    <text x="988" y="138" font-size="12" fill="#9a6700">PERMISSION GATE</text>
    <text x="988" y="176" font-size="18" font-weight="700" fill="#9a6700">HUMAN</text>
    <text x="988" y="202" font-size="18" font-weight="700" fill="#9a6700">CONTROL</text>
    <text x="988" y="229" font-size="12" fill="#59636e">approve · decide</text>
    <circle cx="1136" cy="130" r="5" fill="#1a7f37" class="guard"/>
  </g>

  <g fill="none" stroke="#087ea4" stroke-width="2" marker-end="url(#arrow)">
    <path d="M202 180h48" class="flow"/>
    <path d="M446 180h48" class="flow"/>
    <path d="M674 180h48" class="flow"/>
    <path d="M912 180h48" class="flow"/>
  </g>

  <path d="M122 242v68h942v-58M353 252v58M589 242v68M822 242v68" fill="none" stroke="#8c959f" stroke-width="1.5"/>
  <path d="M122 310h942" fill="none" stroke="#9a6700" stroke-width="2" class="flow"/>
  <circle cx="122" cy="310" r="4" fill="#9a6700"/><circle cx="353" cy="310" r="4" fill="#9a6700"/><circle cx="589" cy="310" r="4" fill="#9a6700"/><circle cx="822" cy="310" r="4" fill="#9a6700"/><circle cx="1064" cy="310" r="4" fill="#9a6700"/>

  <g class="mono" font-size="12">
    <text x="42" y="351" fill="#59636e">CONTROL BUS</text>
    <text x="152" y="351" fill="#1f2328">shared context</text>
    <text x="320" y="351" fill="#8c959f">·</text>
    <text x="342" y="351" fill="#1f2328">audit trail</text>
    <text x="478" y="351" fill="#8c959f">·</text>
    <text x="500" y="351" fill="#1f2328">permission boundary</text>
    <text x="42" y="401" fill="#087ea4">$</text>
    <text x="63" y="401" fill="#1f2328">request routed; important decisions remain human</text>
    <rect x="414" y="387" width="8" height="17" rx="1" fill="#9a6700" class="cursor"/>
    <text x="1158" y="401" text-anchor="end" fill="#8c959f">ASSISTANT FIRST · HUMAN IN CONTROL</text>
  </g>
</svg>
