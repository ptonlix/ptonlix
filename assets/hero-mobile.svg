<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Ptonlix Agent Control Plane mobile view</title>
  <desc id="desc">Compact terminal profile showing identity, mission, and active AI projects.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22303c"/></pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .status { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .42; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .status { animation: none; } }
    </style>
  </defs>
  <rect width="640" height="800" rx="14" fill="#0d1117"/>
  <rect width="640" height="800" rx="14" fill="url(#grid)" opacity=".72"/>
  <rect x="1" y="1" width="638" height="798" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="638" height="48" rx="13" fill="#161b22"/>
  <path d="M1 36h638" stroke="#161b22" stroke-width="24"/><path d="M1 49h638" stroke="#30363d"/>
  <circle cx="24" cy="25" r="6" fill="#ff7b72"/><circle cx="44" cy="25" r="6" fill="#d29922"/><circle cx="64" cy="25" r="6" fill="#3fb950"/>
  <text x="616" y="31" text-anchor="end" class="mono" font-size="13" fill="#7d8590">agent-control-plane:~</text>

  <rect x="22" y="72" width="596" height="194" rx="10" fill="#111820" stroke="#30363d"/>
  <g transform="translate(42 94)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 0l58 34v68l-58 34-58-34V34z" stroke="#39d0d8" stroke-width="2.5"/>
    <path d="M73 24l38 22v44l-38 22-38-22V46z" stroke="#f2a65a" stroke-width="2"/>
    <circle cx="73" cy="68" r="18" fill="#0d1117" stroke="#39d0d8" stroke-width="2"/>
    <text x="73" y="74" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#c9d1d9" stroke="none">PX</text>
    <circle cx="73" cy="0" r="5" fill="#3fb950" stroke="none" class="status"/>
  </g>
  <g class="mono">
    <text x="208" y="105" font-size="13" fill="#7d8590">IDENTITY NODE / PX-0917</text>
    <text x="208" y="142" font-size="21" font-weight="700" fill="#c9d1d9">陈富东 / CyberFD</text>
    <text x="208" y="174" font-size="15" fill="#39d0d8">AI PM · DEVELOPER · FOUNDER</text>
    <text x="208" y="208" font-size="14" fill="#7d8590">STACK</text>
    <text x="284" y="208" font-size="14" fill="#c9d1d9">Python / Go / TypeScript</text>
    <text x="208" y="238" font-size="14" fill="#7d8590">MODE</text>
    <text x="284" y="238" font-size="14" fill="#3fb950">BUILDING</text>
  </g>

  <g class="mono">
    <text x="30" y="307" font-size="17" fill="#39d0d8">$ cat mission.txt</text>
    <text x="48" y="343" font-size="19" fill="#f2a65a">Move AI into real workflows.</text>
    <text x="48" y="375" font-size="18" fill="#c9d1d9">Build with humans. Ship what works.</text>
    <path d="M30 403h580" stroke="#30363d"/>

    <text x="30" y="441" font-size="17" fill="#39d0d8">$ systemctl --user --type=service</text>

    <text x="48" y="484" font-size="16" fill="#3fb950">● active</text>
    <text x="145" y="484" font-size="16" font-weight="700" fill="#c9d1d9">beeweave.service</text>
    <text x="145" y="508" font-size="14" fill="#7d8590">personal knowledge flywheel</text>

    <text x="48" y="555" font-size="16" fill="#3fb950">● active</text>
    <text x="145" y="555" font-size="16" font-weight="700" fill="#c9d1d9">magicchat.service</text>
    <text x="145" y="579" font-size="14" fill="#7d8590">enterprise AI workspace</text>

    <text x="48" y="626" font-size="16" fill="#3fb950">● active</text>
    <text x="145" y="626" font-size="16" font-weight="700" fill="#c9d1d9">gohumanloop.service</text>
    <text x="145" y="650" font-size="14" fill="#7d8590">human-in-the-loop runtime</text>

    <path d="M30 684h580" stroke="#30363d"/>
    <text x="30" y="725" font-size="17" fill="#39d0d8">$</text>
    <rect x="54" y="709" width="10" height="20" rx="1" fill="#f2a65a" class="cursor"/>
    <text x="610" y="725" text-anchor="end" font-size="12" fill="#52606d">CONTROL PLANE READY</text>
    <text x="30" y="769" font-size="13" fill="#7d8590">Asia/Shanghai · human + agent · online</text>
  </g>
</svg>
