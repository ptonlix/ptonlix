<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">MagicChat enterprise agent bus mobile view</title>
  <desc id="desc">Vertical enterprise workflow from requests through Moli Agent to human control.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22303c"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#39d0d8"/></marker>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .flow { stroke-dasharray: 8 10; animation: stream 1.8s linear infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .guard { animation: guard 2.6s ease-in-out infinite; }
      @keyframes stream { to { stroke-dashoffset: -36; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes guard { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .flow, .cursor, .guard { animation: none; } }
    </style>
  </defs>
  <rect width="640" height="960" rx="14" fill="#0d1117"/>
  <rect width="640" height="960" rx="14" fill="url(#grid)" opacity=".72"/>
  <rect x="1" y="1" width="638" height="958" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="638" height="48" rx="13" fill="#161b22"/>
  <path d="M1 36h638" stroke="#161b22" stroke-width="24"/><path d="M1 49h638" stroke="#30363d"/>
  <circle cx="24" cy="25" r="6" fill="#ff7b72"/><circle cx="44" cy="25" r="6" fill="#d29922"/><circle cx="64" cy="25" r="6" fill="#3fb950"/>
  <text x="92" y="31" class="mono" font-size="14" fill="#c9d1d9">magicchat.agent-bus</text>
  <text x="612" y="31" text-anchor="end" class="mono" font-size="11" fill="#f2a65a">CORE DEVELOPER</text>
  <text x="30" y="82" class="mono" font-size="13" fill="#7d8590">$ route --assistant=moli --human-in-control</text>

  <g class="mono">
    <rect x="50" y="103" width="540" height="112" rx="9" fill="#111820" stroke="#30363d"/>
    <text x="72" y="134" font-size="13" fill="#7d8590">INBOUND</text><text x="72" y="174" font-size="22" font-weight="700" fill="#c9d1d9">REQUEST</text><text x="278" y="174" font-size="15" fill="#7d8590">message · mail · event</text>
    <rect x="50" y="250" width="540" height="122" rx="9" fill="#111820" stroke="#39d0d8" stroke-width="2"/>
    <text x="72" y="281" font-size="13" fill="#f2a65a">PERSONAL AI</text><text x="72" y="321" font-size="22" font-weight="700" fill="#39d0d8">MOLI AGENT</text><text x="278" y="313" font-size="15" fill="#7d8590">understand · triage</text><text x="278" y="340" font-size="15" fill="#7d8590">summarize · draft</text>
    <rect x="50" y="407" width="540" height="112" rx="9" fill="#111820" stroke="#30363d"/>
    <text x="72" y="438" font-size="13" fill="#7d8590">WORKSPACE</text><text x="72" y="478" font-size="22" font-weight="700" fill="#c9d1d9">CONTEXT</text><text x="278" y="478" font-size="15" fill="#7d8590">people · history · policy</text>
    <rect x="50" y="554" width="540" height="112" rx="9" fill="#111820" stroke="#30363d"/>
    <text x="72" y="585" font-size="13" fill="#7d8590">EXECUTION</text><text x="72" y="625" font-size="22" font-weight="700" fill="#c9d1d9">TASK</text><text x="278" y="625" font-size="15" fill="#7d8590">assign · execute · follow up</text>
    <rect x="50" y="701" width="540" height="122" rx="9" fill="#111820" stroke="#f2a65a" stroke-width="2"/>
    <text x="72" y="732" font-size="13" fill="#f2a65a">PERMISSION GATE</text><text x="72" y="772" font-size="22" font-weight="700" fill="#f2a65a">HUMAN CONTROL</text><text x="328" y="772" font-size="15" fill="#7d8590">approve · decide</text><circle cx="565" cy="728" r="5" fill="#3fb950" class="guard"/>
  </g>
  <g fill="none" stroke="#39d0d8" stroke-width="2" marker-end="url(#arrow)"><path d="M320 215v25" class="flow"/><path d="M320 372v25" class="flow"/><path d="M320 519v25" class="flow"/><path d="M320 666v25" class="flow"/></g>
  <g class="mono"><text x="30" y="864" font-size="14" fill="#f2a65a">CONTROL BUS</text><text x="148" y="864" font-size="14" fill="#c9d1d9">context · audit · permissions</text><path d="M30 884h580" stroke="#30363d"/><text x="30" y="924" font-size="14" fill="#39d0d8">$</text><text x="53" y="924" font-size="14" fill="#c9d1d9">important decisions remain human</text><rect x="340" y="909" width="9" height="19" rx="1" fill="#f2a65a" class="cursor"/></g>
</svg>
