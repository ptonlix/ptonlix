<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MagicChat enterprise agent bus</title>
  <desc id="desc">An animated enterprise workflow connecting requests, Moli Agent, context, tasks, and human control.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#22303c"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#39d0d8"/></marker>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .flow { stroke-dasharray: 8 10; animation: stream 1.8s linear infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .guard { animation: guard 2.6s ease-in-out infinite; }
      @keyframes stream { to { stroke-dashoffset: -36; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes guard { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .flow, .cursor, .guard { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="14" fill="#0d1117"/>
  <rect width="1200" height="430" rx="14" fill="url(#grid)" opacity=".7"/>
  <rect x="1" y="1" width="1198" height="428" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="48" rx="13" fill="#161b22"/>
  <path d="M1 36h1198" stroke="#161b22" stroke-width="24"/>
  <path d="M1 49h1198" stroke="#30363d"/>
  <circle cx="24" cy="25" r="6" fill="#ff7b72"/><circle cx="44" cy="25" r="6" fill="#d29922"/><circle cx="64" cy="25" r="6" fill="#3fb950"/>
  <text x="92" y="31" class="mono" font-size="14" fill="#c9d1d9">magicchat.enterprise-agent-bus</text>
  <text x="1168" y="31" text-anchor="end" class="mono" font-size="12" fill="#f2a65a">chaitin/MagicChat · CORE DEVELOPER</text>

  <text x="42" y="85" class="mono" font-size="13" fill="#7d8590">$ magicchat route --assistant=moli --policy=human-in-control</text>

  <g class="mono">
    <rect x="42" y="118" width="160" height="124" rx="9" fill="#111820" stroke="#30363d"/>
    <text x="60" y="146" font-size="12" fill="#7d8590">INBOUND</text>
    <text x="60" y="180" font-size="18" font-weight="700" fill="#c9d1d9">REQUEST</text>
    <text x="60" y="208" font-size="12" fill="#7d8590">message · mail</text>

    <rect x="260" y="108" width="186" height="144" rx="9" fill="#111820" stroke="#39d0d8" stroke-width="2"/>
    <text x="278" y="138" font-size="12" fill="#f2a65a">PERSONAL AI</text>
    <text x="278" y="176" font-size="20" font-weight="700" fill="#39d0d8">MOLI AGENT</text>
    <text x="278" y="205" font-size="12" fill="#7d8590">understand · triage</text>
    <text x="278" y="229" font-size="12" fill="#7d8590">summarize · draft</text>

    <rect x="504" y="118" width="170" height="124" rx="9" fill="#111820" stroke="#30363d"/>
    <text x="522" y="146" font-size="12" fill="#7d8590">WORKSPACE</text>
    <text x="522" y="180" font-size="18" font-weight="700" fill="#c9d1d9">CONTEXT</text>
    <text x="522" y="208" font-size="12" fill="#7d8590">people · history</text>

    <rect x="732" y="118" width="180" height="124" rx="9" fill="#111820" stroke="#30363d"/>
    <text x="750" y="146" font-size="12" fill="#7d8590">EXECUTION</text>
    <text x="750" y="180" font-size="18" font-weight="700" fill="#c9d1d9">TASK</text>
    <text x="750" y="208" font-size="12" fill="#7d8590">assign · follow up</text>

    <rect x="970" y="108" width="188" height="144" rx="9" fill="#111820" stroke="#f2a65a" stroke-width="2"/>
    <text x="988" y="138" font-size="12" fill="#f2a65a">PERMISSION GATE</text>
    <text x="988" y="176" font-size="18" font-weight="700" fill="#f2a65a">HUMAN</text>
    <text x="988" y="202" font-size="18" font-weight="700" fill="#f2a65a">CONTROL</text>
    <text x="988" y="229" font-size="12" fill="#7d8590">approve · decide</text>
    <circle cx="1136" cy="130" r="5" fill="#3fb950" class="guard"/>
  </g>

  <g fill="none" stroke="#39d0d8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M202 180h48" class="flow"/>
    <path d="M446 180h48" class="flow"/>
    <path d="M674 180h48" class="flow"/>
    <path d="M912 180h48" class="flow"/>
  </g>

  <path d="M122 242v68h942v-58M353 252v58M589 242v68M822 242v68" fill="none" stroke="#52606d" stroke-width="1.5"/>
  <path d="M122 310h942" fill="none" stroke="#f2a65a" stroke-width="2" class="flow"/>
  <circle cx="122" cy="310" r="4" fill="#f2a65a"/><circle cx="353" cy="310" r="4" fill="#f2a65a"/><circle cx="589" cy="310" r="4" fill="#f2a65a"/><circle cx="822" cy="310" r="4" fill="#f2a65a"/><circle cx="1064" cy="310" r="4" fill="#f2a65a"/>

  <g class="mono" font-size="12">
    <text x="42" y="351" fill="#7d8590">CONTROL BUS</text>
    <text x="152" y="351" fill="#c9d1d9">shared context</text>
    <text x="320" y="351" fill="#52606d">·</text>
    <text x="342" y="351" fill="#c9d1d9">audit trail</text>
    <text x="478" y="351" fill="#52606d">·</text>
    <text x="500" y="351" fill="#c9d1d9">permission boundary</text>
    <text x="42" y="401" fill="#39d0d8">$</text>
    <text x="63" y="401" fill="#c9d1d9">request routed; important decisions remain human</text>
    <rect x="414" y="387" width="8" height="17" rx="1" fill="#f2a65a" class="cursor"/>
    <text x="1158" y="401" text-anchor="end" fill="#52606d">ASSISTANT FIRST · HUMAN IN CONTROL</text>
  </g>
</svg>
