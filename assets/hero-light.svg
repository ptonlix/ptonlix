<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Ptonlix Agent Control Plane</title>
  <desc id="desc">Terminal-style profile showing identity, mission, and active AI projects.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d8dee4"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .status { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .42; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .status { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="560" rx="14" fill="#f6f8fa"/>
  <rect width="1200" height="560" rx="14" fill="url(#grid)" opacity=".76"/>
  <rect x="1" y="1" width="1198" height="558" rx="13" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <rect x="1" y="1" width="1198" height="48" rx="13" fill="#ffffff"/>
  <path d="M1 36h1198" stroke="#ffffff" stroke-width="24"/>
  <path d="M1 49h1198" stroke="#d0d7de"/>
  <circle cx="24" cy="25" r="6" fill="#cf222e"/>
  <circle cx="44" cy="25" r="6" fill="#bf8700"/>
  <circle cx="64" cy="25" r="6" fill="#1a7f37"/>
  <text x="600" y="31" text-anchor="middle" class="mono" font-size="14" fill="#59636e">ptonlix@agent-control-plane:~</text>

  <rect x="28" y="75" width="330" height="456" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="108" class="mono" font-size="13" fill="#59636e">IDENTITY NODE / PX-0917</text>

  <g transform="translate(52 132)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M127 0l72 42v84l-72 42-72-42V42z" stroke="#087ea4" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M127 25l50 29v59l-50 29-50-29V54z" stroke="#9a6700" stroke-width="2"/>
    <path d="M127 0V25M199 42l-22 12M199 126l-22-13M127 168v-26M55 126l22-13M55 42l22 12" stroke="#8c959f" stroke-width="1.5"/>
    <circle cx="127" cy="84" r="20" fill="#ffffff" stroke="#087ea4" stroke-width="2"/>
    <text x="127" y="91" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#1f2328" stroke="none">PX</text>
    <circle cx="127" cy="0" r="5" fill="#1a7f37" stroke="none" class="status"/>
    <circle cx="199" cy="42" r="4" fill="#087ea4" stroke="none"/>
    <circle cx="199" cy="126" r="4" fill="#9a6700" stroke="none"/>
    <circle cx="127" cy="168" r="4" fill="#087ea4" stroke="none"/>
    <circle cx="55" cy="126" r="4" fill="#9a6700" stroke="none"/>
    <circle cx="55" cy="42" r="4" fill="#087ea4" stroke="none"/>
  </g>

  <g class="mono" font-size="13">
    <text x="52" y="336" fill="#59636e">NODE TYPE</text>
    <text x="162" y="336" fill="#1f2328">human + agent</text>
    <text x="52" y="365" fill="#59636e">FOCUS</text>
    <text x="162" y="365" fill="#087ea4">AI workflows</text>
    <text x="52" y="394" fill="#59636e">STACK</text>
    <text x="162" y="394" fill="#1f2328">Python / Go / TS</text>
    <text x="52" y="423" fill="#59636e">MODE</text>
    <text x="162" y="423" fill="#1a7f37">BUILDING</text>
    <path d="M52 448h278" stroke="#d0d7de"/>
    <text x="52" y="478" fill="#9a6700">AI PM</text>
    <text x="112" y="478" fill="#8c959f">/</text>
    <text x="128" y="478" fill="#087ea4">DEVELOPER</text>
    <text x="228" y="478" fill="#8c959f">/</text>
    <text x="244" y="478" fill="#1f2328">FOUNDER</text>
    <text x="52" y="507" fill="#59636e">Asia/Shanghai · online</text>
  </g>

  <g class="mono">
    <text x="398" y="94" font-size="14" fill="#59636e">SESSION 01 / INTERACTIVE PROFILE</text>
    <text x="398" y="136" font-size="17" fill="#087ea4">$ whoami</text>
    <text x="420" y="166" font-size="19" font-weight="700" fill="#1f2328">Baird / ptonlix</text>
    <text x="420" y="193" font-size="15" fill="#59636e">AI Product Manager · Developer · Entrepreneur</text>

    <text x="398" y="240" font-size="17" fill="#087ea4">$ cat mission.txt</text>
    <text x="420" y="273" font-size="18" fill="#9a6700">Move AI from answers into real workflows.</text>
    <text x="420" y="302" font-size="18" fill="#1f2328">Build with humans. Ship things that work.</text>

    <text x="398" y="349" font-size="17" fill="#087ea4">$ systemctl --user --type=service</text>
    <text x="420" y="386" font-size="14" fill="#1a7f37">● active</text>
    <text x="510" y="386" font-size="14" fill="#1f2328">beeweave.service</text>
    <text x="700" y="386" font-size="14" fill="#59636e">personal knowledge flywheel</text>
    <text x="420" y="421" font-size="14" fill="#1a7f37">● active</text>
    <text x="510" y="421" font-size="14" fill="#1f2328">magicchat.service</text>
    <text x="700" y="421" font-size="14" fill="#59636e">enterprise AI workspace</text>
    <text x="420" y="456" font-size="14" fill="#1a7f37">● active</text>
    <text x="510" y="456" font-size="14" fill="#1f2328">gohumanloop.service</text>
    <text x="700" y="456" font-size="14" fill="#59636e">human-in-the-loop runtime</text>

    <path d="M398 484h738" stroke="#d0d7de"/>
    <text x="398" y="516" font-size="16" fill="#087ea4">$</text>
    <rect x="421" y="501" width="10" height="18" rx="1" fill="#9a6700" class="cursor"/>
    <text x="1136" y="516" text-anchor="end" font-size="12" fill="#8c959f">CONTROL PLANE READY</text>
  </g>
</svg>
