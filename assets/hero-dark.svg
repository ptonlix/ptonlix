<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Ptonlix Agent Control Plane</title>
  <desc id="desc">Terminal-style profile showing identity, mission, and active AI projects.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#22303c"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .status { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .42; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .status { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="560" rx="14" fill="#0d1117"/>
  <rect width="1200" height="560" rx="14" fill="url(#grid)" opacity=".72"/>
  <rect x="1" y="1" width="1198" height="558" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>

  <rect x="1" y="1" width="1198" height="48" rx="13" fill="#161b22"/>
  <path d="M1 36h1198" stroke="#161b22" stroke-width="24"/>
  <path d="M1 49h1198" stroke="#30363d"/>
  <circle cx="24" cy="25" r="6" fill="#ff7b72"/>
  <circle cx="44" cy="25" r="6" fill="#d29922"/>
  <circle cx="64" cy="25" r="6" fill="#3fb950"/>
  <text x="600" y="31" text-anchor="middle" class="mono" font-size="14" fill="#7d8590">ptonlix@agent-control-plane:~</text>

  <rect x="28" y="75" width="330" height="456" rx="10" fill="#111820" stroke="#30363d"/>
  <text x="52" y="108" class="mono" font-size="13" fill="#7d8590">IDENTITY NODE / PX-0917</text>

  <g transform="translate(52 132)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M127 0l72 42v84l-72 42-72-42V42z" stroke="#39d0d8" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M127 25l50 29v59l-50 29-50-29V54z" stroke="#f2a65a" stroke-width="2"/>
    <path d="M127 0V25M199 42l-22 12M199 126l-22-13M127 168v-26M55 126l22-13M55 42l22 12" stroke="#52606d" stroke-width="1.5"/>
    <circle cx="127" cy="84" r="20" fill="#0d1117" stroke="#39d0d8" stroke-width="2"/>
    <text x="127" y="91" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#c9d1d9" stroke="none">PX</text>
    <circle cx="127" cy="0" r="5" fill="#3fb950" stroke="none" class="status"/>
    <circle cx="199" cy="42" r="4" fill="#39d0d8" stroke="none"/>
    <circle cx="199" cy="126" r="4" fill="#f2a65a" stroke="none"/>
    <circle cx="127" cy="168" r="4" fill="#39d0d8" stroke="none"/>
    <circle cx="55" cy="126" r="4" fill="#f2a65a" stroke="none"/>
    <circle cx="55" cy="42" r="4" fill="#39d0d8" stroke="none"/>
  </g>

  <g class="mono" font-size="13">
    <text x="52" y="336" fill="#7d8590">NODE TYPE</text>
    <text x="162" y="336" fill="#c9d1d9">human + agent</text>
    <text x="52" y="365" fill="#7d8590">FOCUS</text>
    <text x="162" y="365" fill="#39d0d8">AI workflows</text>
    <text x="52" y="394" fill="#7d8590">STACK</text>
    <text x="162" y="394" fill="#c9d1d9">Python / Go / TS</text>
    <text x="52" y="423" fill="#7d8590">MODE</text>
    <text x="162" y="423" fill="#3fb950">BUILDING</text>
    <path d="M52 448h278" stroke="#30363d"/>
    <text x="52" y="478" fill="#f2a65a">AI PM</text>
    <text x="112" y="478" fill="#52606d">/</text>
    <text x="128" y="478" fill="#39d0d8">DEVELOPER</text>
    <text x="228" y="478" fill="#52606d">/</text>
    <text x="244" y="478" fill="#c9d1d9">FOUNDER</text>
    <text x="52" y="507" fill="#7d8590">Asia/Shanghai · online</text>
  </g>

  <g class="mono">
    <text x="398" y="94" font-size="14" fill="#7d8590">SESSION 01 / INTERACTIVE PROFILE</text>
    <text x="398" y="136" font-size="17" fill="#39d0d8">$ whoami</text>
    <text x="420" y="166" font-size="19" font-weight="700" fill="#c9d1d9">陈富东 / CyberFD</text>
    <text x="420" y="193" font-size="15" fill="#7d8590">AI Product Manager · Developer · Entrepreneur</text>

    <text x="398" y="240" font-size="17" fill="#39d0d8">$ cat mission.txt</text>
    <text x="420" y="273" font-size="18" fill="#f2a65a">Move AI from answers into real workflows.</text>
    <text x="420" y="302" font-size="18" fill="#c9d1d9">Build with humans. Ship things that work.</text>

    <text x="398" y="349" font-size="17" fill="#39d0d8">$ systemctl --user --type=service</text>
    <text x="420" y="386" font-size="14" fill="#3fb950">● active</text>
    <text x="510" y="386" font-size="14" fill="#c9d1d9">beeweave.service</text>
    <text x="700" y="386" font-size="14" fill="#7d8590">personal knowledge flywheel</text>
    <text x="420" y="421" font-size="14" fill="#3fb950">● active</text>
    <text x="510" y="421" font-size="14" fill="#c9d1d9">magicchat.service</text>
    <text x="700" y="421" font-size="14" fill="#7d8590">enterprise AI workspace</text>
    <text x="420" y="456" font-size="14" fill="#3fb950">● active</text>
    <text x="510" y="456" font-size="14" fill="#c9d1d9">gohumanloop.service</text>
    <text x="700" y="456" font-size="14" fill="#7d8590">human-in-the-loop runtime</text>

    <path d="M398 484h738" stroke="#30363d"/>
    <text x="398" y="516" font-size="16" fill="#39d0d8">$</text>
    <rect x="421" y="501" width="10" height="18" rx="1" fill="#f2a65a" class="cursor"/>
    <text x="1136" y="516" text-anchor="end" font-size="12" fill="#52606d">CONTROL PLANE READY</text>
  </g>
</svg>
